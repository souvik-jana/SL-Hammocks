[workspace]
channels = ["conda-forge"]
name = "SL-Hammocks"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
setup = { depends-on = ["install-glafic"] }
install-glafic = "bash scripts/install_glafic.sh"
test = "pytest tests/"
lint = "ruff check ."
format = "ruff format ."

[dependencies]
python = "3.11.*"
numpy = ">=2.4.6,<3"
scipy = ">=1.17.1,<2"
cfitsio = ">=4.6.4,<5"
fftw = ">=3.3.11,<4"
gsl = ">=2.8,<3"
cxx-compiler = ">=1.11.0,<2"
make = ">=4.4.1,<5"
git = ">=2.54.0,<3"
pip = ">=26.1.2,<27"
astropy = ">=7.2.0,<8"

[pypi-dependencies]
colossus = ">=1.4.0, <2"
joblib = ">=1.5.3, <2"
pytest = ">=8,<9"
ruff = ">=0.9,<1"
